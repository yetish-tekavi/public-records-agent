[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "semantic_model: needs the all-MiniLM-L6-v2 embedding model (downloaded on first use)",
    "integration: starts real subprocesses (e.g. the MCP server)",
]
filterwarnings = [
    "ignore::DeprecationWarning:chromadb.*",
]
